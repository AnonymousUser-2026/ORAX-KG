# ============================================================================
# ORAX-KG Configuration
# ============================================================================

run_name: "retacred_qwen"

# Device for embedding models: "cpu" or "cuda" (auto-detected if omitted)
device: "cpu"

# Data 
data:
  test_path:   "data/raw_data/DATASET_EXAMPLE.json"
  schema_path: "data/ontologies/ReTACRED_ontology.json"

# Output
output:
  base_dir: "results"

# Step 1: Extraction
extraction:
  base_url:    "http://localhost:8000"
  model:       "Qwen/Qwen3-14B"

# Step 2: Alignment
alignment:
  embedder_model: "sentence-transformers/all-MiniLM-L6-v2"
  threshold:      0.90         # cosine similarity threshold for known-relation matching

# Step 3: Clustering 
clustering:
  similarity_threshold: 0.60   # minimum similarity for graph-split connectivity
  n_consensus_runs:     3      # voting rounds per algorithm
  preserve_singletons:  false   # omit size-1 clusters

# Step 4: Validation 
validation:
  base_url:              "http://localhost:8000"
  model:                 "Qwen/Qwen3-14B"   # can use a larger model than extraction
  top_k_representatives: 5                  # triples shown to LLM per cluster
  min_cluster_size:      5                  # skip clusters smaller than this
  min_confidence:        "Medium"           # Low | Medium | High
